resources:
  jobs:
    telecom_pipeline:
      name: Telecom Daily Pipeline

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold.py